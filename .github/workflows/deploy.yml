name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # "build" runs tsc first, so type errors fail the pipeline here.
      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://tradecall.in
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # Hashed assets go up first and old ones are only removed afterwards, so
      # visitors mid-deploy never get an index.html pointing at missing files.
      - name: Upload to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          RSYNC_SSH="ssh -i $HOME/.ssh/deploy_key"
          rsync -az -e "$RSYNC_SSH" dist/assets/ "deploy@$VPS_HOST:/var/www/tradecall/assets/"
          rsync -az --delete-after --delay-updates -e "$RSYNC_SSH" dist/ "deploy@$VPS_HOST:/var/www/tradecall/"

      - name: Smoke test
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: curl -fsSL "http://$VPS_HOST/" | grep -q "<div id=\"root\">"
